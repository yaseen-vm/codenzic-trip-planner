name: Format review branch

on:
  push:
    branches: [fix/repo-review-findings]

permissions:
  contents: write

concurrency:
  group: format-review-branch
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: fix/repo-review-findings
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format source files
        run: npx prettier --write "**/*.{ts,tsx,js,mjs,mts,json,md,yml}"
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format review changes"
          git push origin HEAD:fix/repo-review-findings
